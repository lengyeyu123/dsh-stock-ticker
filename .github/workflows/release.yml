# tag 触发：先用 OIDC 发布到 npm（Trusted Publishing，不需要任何 token），再建 GitHub Release。
#
# 一次性前置配置（npmjs.com → 该包 → Settings → Trusted Publishing）：
#   Publisher          GitHub Actions
#   Organization       lengyeyu123
#   Repository         dsh-stock-ticker
#   Workflow filename  release.yml
#   Environment        留空
#
# 这里刻意不写 setup-node 的 `registry-url`：它会生成带 `_authToken=${NODE_AUTH_TOKEN}`
# 的 .npmrc，而 OIDC 流程下没有这个变量，npm 会报 "Failed to replace env in config"。
# GitHub runner 的默认 registry 本来就是 registry.npmjs.org，不用额外指定。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # OIDC：npm 用它换短期发布凭证，同时生成 provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 升级 npm
        run: |
          # Trusted Publishing 需要 npm >= 11.5.1，Node 22 自带的是 10.x
          npm install -g npm@latest
          npm --version

      - name: 安装依赖
        run: npm ci

      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 package.json 的 $pkg 不一致"
            exit 1
          fi
          echo "版本 $pkg 校验通过"

      - name: 类型检查与构建
        run: |
          npm run typecheck
          npm run build

      - name: 发布到 npm
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # 版本已在 registry 上就跳过，重跑 workflow 不会因为重复发布而失败
          if npm view "dsh-stock-ticker@$version" version >/dev/null 2>&1; then
            echo "dsh-stock-ticker@$version 已在 npm 上，跳过发布"
          else
            npm publish --provenance --access public
          fi

      - name: 打包 tarball
        run: npm pack

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release 已存在，只补传 tarball"
            gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.tgz \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
