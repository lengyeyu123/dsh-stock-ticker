# 只发 GitHub Release，不再发布到 npm。
#
# 触发：推送 v* tag → 校验版本 → 类型检查 + 构建 → 打包 tarball → 建 Release。
# 不需要任何 secret，GITHUB_TOKEN 由 Actions 自动提供。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 package.json 的 $pkg 不一致"
            exit 1
          fi
          echo "版本 $pkg 校验通过"

      - name: 类型检查与构建
        run: |
          npm run typecheck
          npm run build

      - name: 打包 tarball
        run: npm pack

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release 已存在，只补传 tarball"
            gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.tgz \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
