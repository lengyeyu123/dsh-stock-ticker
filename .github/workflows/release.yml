# tag 触发：先发 npm，再建 GitHub Release。
#
# npm 认证二选一：
#   1) 仓库 secret `NPM_TOKEN`（npm 的 Automation token）
#   2) npm 后台配 Trusted Publishing（OIDC），然后把下面 publish 步骤的 NODE_AUTH_TOKEN 删掉
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # provenance / trusted publishing 需要 OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 package.json 的 $pkg 不一致"
            exit 1
          fi
          echo "版本 $pkg 校验通过"

      - name: 类型检查与构建
        run: |
          npm run typecheck
          npm run build

      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # 版本已在 registry 上就跳过，重跑 workflow 不会因为重复发布而失败
          if npm view "dsh-stock-ticker@$version" version >/dev/null 2>&1; then
            echo "dsh-stock-ticker@$version 已在 npm 上，跳过发布"
          else
            npm publish --provenance --access public
          fi

      - name: 打包 tarball
        run: npm pack

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release 已存在，只补传 tarball"
            gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.tgz \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
